name: Update weather data

on:
  schedule:
    # Each run refreshes weather.json every minute for ~5.75 hours and then
    # dispatches its own successor, so coverage is continuous even when
    # GitHub skips or delays a cron tick (it often does, by 30-90 min).
    # The 2-hourly cron is the backstop: a fresh run cancels the old one.
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: weather-loop
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - name: Fetch conditions every minute for ~5.75 hours
        # Single amended commit force-pushed to weather-data keeps history
        # clean; a failed fetch skips the push and tries again next minute.
        run: |
          tmp=$(mktemp -d)
          cd "$tmp"
          git init -q -b weather-data
          # Start from the last published file so a quiet station still gets
          # a "checked" heartbeat on top of the previous readings.
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/weather.json?ref=weather-data" \
            -o weather.json || echo "no previous weather.json"
          end=$((SECONDS + 345 * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            if python3 "$GITHUB_WORKSPACE/scripts/fetch_weather.py" weather.json > /dev/null; then
              git add weather.json
              git -c user.name="weather-bot" -c user.email="actions@github.com" commit -q --amend -m "weather update" 2>/dev/null \
                || git -c user.name="weather-bot" -c user.email="actions@github.com" commit -q -m "weather update"
              git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" weather-data || true
              echo "$(date -u +%H:%M:%S) published"
            else
              echo "$(date -u +%H:%M:%S) fetch failed, retrying next cycle"
            fi
            sleep 45
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hand off to the next run
        # workflow_dispatch is one of the events GITHUB_TOKEN is allowed to
        # trigger; the new run's concurrency group cancels this one.
        run: gh workflow run weather.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
